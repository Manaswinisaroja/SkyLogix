function ctlDraw(upto){if(!CTL)return;if(!$('#cg_PID')){ctlStop();return}const n=upto||CTL.t.length,t=CTL.t.slice(0,n),sh=$('#csh')&&$('#csh').checked,
 mx=sh?Math.max(...CORD.map(k=>Math.max(...CTL.graphs[k].traces.map(r=>Math.max(...r.err)))))*1.05:null;
 CK.forEach(([k,ti])=>{const ph=$('#cg_'+k);if(ph&&ph.querySelector('p.mu'))ph.innerHTML='';const tr=CTL.graphs[k].traces.map((r,i)=>({x:t,y:r.err.slice(0,n),name:r.name,mode:'lines',line:{color:D6[i],width:1.5},hovertemplate:`${r.name}<br>t = %{x:.1f} s<br>error = %{y:.3f} m<extra></extra>`})),
  L=lay(ti+' · 6 drones','Tracking error (m)');L.xaxis.range=[0,CTL.duration];L.yaxis.rangemode='tozero';if(mx)L.yaxis.range=[0,mx];L.margin.b=80;L.legend.y=-.4;L.uirevision=undefined;Plotly.react('cg_'+k,tr,L,cfg)});
 if(!upto)ctlTables()}
function ctlTables(){const S=Object.fromEntries(CTL.summary.map(r=>[r.key,r])),rk=[...CTL.summary].sort((a,b)=>b.score-a.score).map(r=>r.key),C=CTL.conditions,
 st=r=>(r.mean_settling==null?'never settled':cf(r.mean_settling,1))+` (${r.settled} settled)`,
 sum=tbl(['Controller','Mean RMSE (m)','Mean MAE (m)','Worst-Case RMSE (m)','Mean Settling Time (s)','Mean Computation Time (ms)','Mean Control Effort (m/s²)','Constraint Violations','Score /100','Rank'],
  CORD.map(k=>{const r=S[k];return[r.controller,cf(r.mean_rmse),cf(r.mean_mae),cf(r.worst_rmse),st(r),cf(r.mean_comp_ms,4),cf(r.mean_effort,2),r.violations,r.score,'#'+(rk.indexOf(k)+1)]}),''),
 det=tbl(['Controller','Drone','RMSE (m)','MAE (m)','Max error (m)','Settling (s)','Control effort (m/s²)','Comp. time (ms)','Violations'],CTL.detail.map(d=>[d.controller,d.drone,cf(d.rmse),cf(d.mae),cf(d.max_err),d.settling_s==null?'never':cf(d.settling_s,1),cf(d.effort,2),cf(d.comp_ms,4),d.violations]),''),
 pos=CTL.improvements.filter(i=>i.claim).map(i=>`<li>${CTL.best} vs ${i.vs}: <b>${i.pct}%</b> lower mean RMSE</li>`).join(''),
 mp=CTL.mpc_vs.map(i=>`<li>${i.improved?`MPC vs ${i.vs}: <b>${i.pct}%</b> lower mean RMSE`:`MPC vs ${i.vs}: no improvement (${i.vs} has lower mean RMSE)`}</li>`).join(''),
 W=CTL.criteria.weights;
 $('#cres').innerHTML=`<h3>Controller comparison table (mean over six drones)</h3><div class="sc">${sum}</div>
<h3>Result</h3><div class="k"><div><span class="mu">Best-performing controller</span><b style="color:var(--ok)">${CTL.best}</b></div><div><span class="mu">Lowest mean RMSE</span><b>${CTL.rmse_best}</b></div></div>
<p>${CTL.best_text}</p><b>RMSE improvement of ${CTL.best} (formula: (Other − ${CTL.best}) / Other × 100):</b><ul>${pos||'<li>none</li>'}</ul><b>MPC, as requested:</b><ul>${mp}</ul>
<p class="mu"><b>Ranking criteria</b> (weights): tracking RMSE ${W.mean_rmse*100}%, settling time ${W.mean_settling_eff*100}%, control effort ${W.mean_effort*100}%, computation time ${W.mean_comp_ms*100}%, constraint violations ${W.violations*100}%. ${CTL.criteria.note}</p>
<p class="mu">Test conditions (identical for every controller): dt = ${C.dt} s, ${C.steps} steps, seed ${C.seed}, wind ×${C.wind_scale}, settling band ±${C.settle_band_m} m, plant lag τ = ${C.plant.tau_s} s with ${Math.round((1-C.plant.gain)*100)}% unmodelled thrust loss, same start/goal and wind for each drone number. Control effort = mean |Δ velocity command| / dt. Violations = steps where the commanded acceleration exceeded the plant limit or altitude went below ground.</p>
<h3>Detailed results (one row per drone per controller)</h3><div class="sc">${det}</div>`}
function ctlCsv(){if(!CTL)return toast('Run the comparison first');const h=['controller','drone','rmse_m','mae_m','max_error_m','settling_s','control_effort','comp_ms','violations'];
 dl('data:text/csv;charset=utf-8,'+encodeURIComponent([h,...CTL.detail.map(d=>[d.controller,d.drone,d.rmse,d.mae,d.max_err,d.settling_s==null?'':d.settling_s,d.effort,d.comp_ms,d.violations])].map(r=>r.join(',')).join('\n')),'controller_comparison.csv')}
/* ---------- live polling (backend only) ---------- */
let busy=false,timer=null;
async function poll(){if(busy)return;busy=true;try{OV=await api('/api/v6/overview');if(!sel||!OV.drones.find(d=>d.id==sel))sel=OV.drones[0]&&OV.drones[0].id;
  const need=sel&&(view=='drone'||view=='missions'||(view=='traj'&&mode=='replan')||(['fleet','traj'].includes(view)&&['pos','vel','acc','att'].includes(tab)));
  if(need)DET=await api('/api/v6/drone/'+sel+'/detail');
  if(view=='traj'&&mode=='fleet')FT=await api('/api/v6/fleet/trajectories');
  if(view=='missions')QS=await api('/api/v6/queue');
  if(view=='ana'||tab=='ana')FA=await api('/api/v6/fleet/analytics');
  if(view=='ana'&&asub=='res')RA=await api('/api/v6/research/analytics');
  $('#st').textContent=`● live · ${OV.drones.length} drones · ${OV.drones.filter(d=>d.state!='IDLE'&&d.state!='LANDED').length} active`;$('#st').className='';$('#err').style.display='none';render()}
 catch(e){$('#st').textContent='● offline';$('#st').className='bad';$('#err').style.display='';$('#err').innerHTML=`Cannot reach the SkyLogix backend at <b>${B||location.origin}</b> (${e.message}). Start <code>python flask_server_v6.py</code> or set the URL in Settings. No data is shown until the backend responds.`}
 busy=false}
const restart=()=>{clearInterval(timer);timer=setInterval(poll,POLL)};
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
setTab('pos');show('fleet');restart();
if(self!==top){const l=document.querySelector('#top a');if(l)l.style.display='none'}
if(location.hash==='#ctl')show('ctl');
</script></body></html>
